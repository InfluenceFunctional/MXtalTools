# MIPCAS sg 2 Z'=1 search, triclinic Niggli reduction penalty -- cluster base for make_configs.py.
#
# House recipe (../mipcas/mipcas_*.yaml, ../qm9_anchors/qm9_sg2_anchors_elj.yaml): random starts sampled in the reduced cell,
# two rprop stages (450 steps compress 1.0 at lr 0.05, then 50 steps relax at lr 0.01), cutoff 10.
# The Niggli penalty is chosen by the ENVIRONMENT (MXT_NIGGLI_TRICLINIC=1, exported by submit.sbatch), not by this file.

device: cuda
mol_path: /scratch/mk8347/data/crystal_datasets/mipcas/MIPCAS_standardized.pt
dataset_path: null
target_path: null
target_identifier: null
umbrella_path: null
out_dir: /scratch/mk8347/data/crystal_datasets/mipcas/nig_sep17
run_name: mipcas_nig

save_trajs: false

uma_predictor_path: /scratch/mk8347/models/uma/esen_s.pt
mace_predictor_path: null
score_model_checkpoint: null

force_restart_run: false

init_sample_method: random
init_reduced: true
init_target_cp: wide

mol_seed: 0
opt_seed: 0
sampling_mode: all
mols_to_sample: 1
num_samples: 5000

sgs_to_search: [ 2 ]
zp_to_search: [ 1 ]

batch_size: 5000
grow_batch_size: false

opt:
  - optim_target: 'elj'
    enforce_reduced: true
    compression_factor: 1.0
    cutoff: 10
    init_lr: 0.05
    convergence_eps: 0.00001
    optimizer_func: 'rprop'
    anneal_lr: false
    grad_norm_clip: 0.1
    show_tqdm: true
    max_num_steps: 450
    target_packing_coeff: null
    umbrella: false

  - optim_target: 'elj'
    enforce_reduced: true
    compression_factor: 0.0
    cutoff: 10
    init_lr: 0.01
    convergence_eps: 0.00001
    optimizer_func: 'rprop'
    anneal_lr: false
    grad_norm_clip: 0.1
    show_tqdm: true
    max_num_steps: 50
    target_packing_coeff: null
    umbrella: false
