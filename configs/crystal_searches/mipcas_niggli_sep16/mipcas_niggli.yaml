# MIPCAS sg2 Z'=1 ELJ search under the TRICLINIC NIGGLI reduction penalty -- local run.
#
# House ELJ recipe (../mipcas/mipcas_elj_*.yaml, ../qm9_anchors/qm9_sg2_anchors_elj.yaml): random init in the reduced
# frame, two rprop stages (450 steps compress 1.0 at lr 0.05, then 50 steps relax at lr 0.01), elj throughout, cutoff 10.
#
# The triclinic Niggli penalty is always on in mxtaltools now; these arms ran with the since-retired MXT_NIGGLI_TRICLINIC=1.
# Both init_reduced (rejection sampler, penalty == 0) and enforce_reduced (10000 * penalty in the loss, final filter
# penalty < 1e-3) read it.
#
#   python mxtaltools/crystal_search/run_search.py --config configs/crystal_searches/mipcas_niggli_sep16/<arm>.yaml

device: cuda
mol_path: D:\crystal_datasets\mipcas\MIPCAS_standardized.pt
dataset_path: null
target_path: null
target_identifier: null
umbrella_path: null
out_dir: D:\crystal_datasets\mipcas\niggli_sep16
run_name: mipcas_niggli_elj

save_trajs: false

uma_predictor_path: null
mace_predictor_path: null
score_model_checkpoint: null

force_restart_run: false

init_sample_method: random
init_reduced: true
init_target_cp: wide

mol_seed: 0
opt_seed: 0
sampling_mode: all
mols_to_sample: 1
num_samples: 1000

sgs_to_search: [ 2 ]
zp_to_search: [ 1 ]

batch_size: 1000
grow_batch_size: false

opt:
  - optim_target: 'elj'
    enforce_reduced: true
    compression_factor: 1.0
    cutoff: 10
    init_lr: 0.05
    convergence_eps: 0.00001
    optimizer_func: 'rprop'
    anneal_lr: false
    grad_norm_clip: 0.1
    show_tqdm: true
    max_num_steps: 450
    target_packing_coeff: null
    umbrella: false

  - optim_target: 'elj'
    enforce_reduced: true
    compression_factor: 0.0
    cutoff: 10
    init_lr: 0.01
    convergence_eps: 0.00001
    optimizer_func: 'rprop'
    anneal_lr: false
    grad_norm_clip: 0.1
    show_tqdm: true
    max_num_steps: 50
    target_packing_coeff: null
    umbrella: false
