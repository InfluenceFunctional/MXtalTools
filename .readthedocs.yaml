# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

python:
  install:
    # CPU-only torch first, from the PyTorch index (the PyPI wheel pulls CUDA).
    - requirements: docs/requirements-torch.txt
    # The package and its pure-Python dependencies (numpy, scipy, rdkit, ase, ...).
    - method: pip
      path: .
    # torch_geometric, Sphinx and the theme.
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
